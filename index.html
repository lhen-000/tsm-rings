<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Open Sans', Arial, sans-serif; font-size: 18px; background: transparent; padding: 0; margin: 0; }

  .tsm-tabs { display: flex; gap: 10px; margin-bottom: 20px; max-width: 520px; }

  .tsm-tab-btn {
    flex: 1; padding: 10px 20px; border-radius: 999px;
    border: 2px solid #e6e6e6; background: #fff;
    font-size: 18px; font-weight: 700; cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    color: #3c3c3b; font-family: 'Open Sans', Arial, sans-serif;
  }
  .tsm-tab-btn.active-settle   { background: #ff9000; border-color: #ff9000; color: #3c3c3b; }
  .tsm-tab-btn.active-paradigm { background: #009bbb; border-color: #009bbb; color: #fff; }

  .tsm-panel { display: none; gap: 32px; justify-content: flex-start; flex-wrap: wrap; max-width: 520px; }
  .tsm-panel.active { display: flex; }

  .tsm-ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tsm-ring-lbl  { font-size: 18px; font-weight: 700; color: #3c3c3b; }
  .tsm-ring-sub  { font-size: 14px; color: #888; }

  .tsm-ring-box { position: relative; width: 120px; height: 120px; }
  .tsm-ring-box svg { transform: rotate(-90deg); display: block; }

  .tsm-ring-txt {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 800; line-height: 1;
    font-family: 'Open Sans', Arial, sans-serif;
  }
  .tsm-ring-txt small { font-size: 0.9rem; font-weight: 700; }

  .tsm-arc {
    fill: none; stroke-linecap: round;
    stroke-dasharray: 314.2; stroke-dashoffset: 314.2;
    transition: stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1);
  }
</style>
</head>
<body>

<div class="tsm-tabs">
  <button id="btn-settle"   class="tsm-tab-btn active-settle"   onclick="showTab('settle')">Settle</button>
  <button id="btn-paradigm" class="tsm-tab-btn"                 onclick="showTab('paradigm')">Paradigm</button>
</div>

<div id="panel-settle" class="tsm-panel active">
  <div class="tsm-ring-wrap">
    <div class="tsm-ring-lbl">Trust</div>
    <div class="tsm-ring-box">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle fill="none" stroke="#e6e6e6" stroke-width="11" cx="60" cy="60" r="50"/>
        <circle id="arc-st" class="tsm-arc" stroke="#ff9000" stroke-width="11" cx="60" cy="60" r="50"/>
      </svg>
      <div class="tsm-ring-txt" style="color:#ff9000"><span id="num-st">0</span><small>%</small></div>
    </div>
    <div class="tsm-ring-sub">Jun-Dec 2025</div>
  </div>
  <div class="tsm-ring-wrap">
    <div class="tsm-ring-lbl">Ease</div>
    <div class="tsm-ring-box">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle fill="none" stroke="#e6e6e6" stroke-width="11" cx="60" cy="60" r="50"/>
        <circle id="arc-se" class="tsm-arc" stroke="#ff9000" stroke-width="11" cx="60" cy="60" r="50"/>
      </svg>
      <div class="tsm-ring-txt" style="color:#ff9000"><span id="num-se">0</span><small>%</small></div>
    </div>
    <div class="tsm-ring-sub">Jun-Dec 2025</div>
  </div>
</div>

<div id="panel-paradigm" class="tsm-panel">
  <div class="tsm-ring-wrap">
    <div class="tsm-ring-lbl">Trust</div>
    <div class="tsm-ring-box">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle fill="none" stroke="#e6e6e6" stroke-width="11" cx="60" cy="60" r="50"/>
        <circle id="arc-pt" class="tsm-arc" stroke="#009bbb" stroke-width="11" cx="60" cy="60" r="50"/>
      </svg>
      <div class="tsm-ring-txt" style="color:#009bbb"><span id="num-pt">0</span><small>%</small></div>
    </div>
    <div class="tsm-ring-sub">Jun-Dec 2025</div>
  </div>
  <div class="tsm-ring-wrap">
    <div class="tsm-ring-lbl">Ease</div>
    <div class="tsm-ring-box">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle fill="none" stroke="#e6e6e6" stroke-width="11" cx="60" cy="60" r="50"/>
        <circle id="arc-pe" class="tsm-arc" stroke="#009bbb" stroke-width="11" cx="60" cy="60" r="50"/>
      </svg>
      <div class="tsm-ring-txt" style="color:#009bbb"><span id="num-pe">0</span><small>%</small></div>
    </div>
    <div class="tsm-ring-sub">Jun-Dec 2025</div>
  </div>
</div>

<script>
  // *** UPDATE SCORES HERE ***
  var scores = {
    settle:   { trust: 72, ease: 68 },
    paradigm: { trust: 78, ease: 74 }
  };

  var C = 314.2;
  var timers = [];

  function offset(pct) { return C - (pct / 100 * C); }

  function animateArc(id, pct) {
    var el = document.getElementById(id);
    if (!el) return;
    el.style.strokeDashoffset = C;
    el.getBoundingClientRect();
    el.style.strokeDashoffset = offset(pct);
  }

  function animateNum(id, pct) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = 0;
    var n = 0;
    var t = setInterval(function() {
      n++;
      el.textContent = n;
      if (n >= pct) clearInterval(t);
    }, 1400 / pct);
    timers.push(t);
  }

  function showTab(org) {
    timers.forEach(clearInterval);
    timers = [];

    document.getElementById('btn-settle').className   = 'tsm-tab-btn' + (org === 'settle'   ? ' active-settle'   : '');
    document.getElementById('btn-paradigm').className = 'tsm-tab-btn' + (org === 'paradigm' ? ' active-paradigm' : '');

    document.getElementById('panel-settle').classList.toggle('active',   org === 'settle');
    document.getElementById('panel-paradigm').classList.toggle('active', org === 'paradigm');

    var s = scores[org];
    var p = org === 'settle' ? 's' : 'p';
    setTimeout(function() {
      animateArc('arc-' + p + 't', s.trust);
      animateArc('arc-' + p + 'e', s.ease);
      animateNum('num-' + p + 't', s.trust);
      animateNum('num-' + p + 'e', s.ease);
    }, 50);
  }

  window.onload = function() {
    setTimeout(function() {
      animateArc('arc-st', scores.settle.trust);
      animateArc('arc-se', scores.settle.ease);
      animateNum('num-st', scores.settle.trust);
      animateNum('num-se', scores.settle.ease);
    }, 400);
  };
</script>
</body>
</html>
