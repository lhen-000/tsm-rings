<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face {
    font-family: 'Open Sans';
    font-style: normal;
    font-weight: 400;
    font-stretch: 100%;
    src: url(https://fonts.gstatic.com/s/opensans/v44/memvYaGs126MiZpBA-UvWbX2vVnXBbObj2OVTS-muw.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Open Sans';
    font-style: normal;
    font-weight: 700;
    font-stretch: 100%;
    src: url(https://fonts.gstatic.com/s/opensans/v44/memvYaGs126MiZpBA-UvWbX2vVnXBbObj2OVTS-muw.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Open Sans', Arial, sans-serif;
    font-size: 16px; font-weight: 400;
    background: transparent; padding: 0; margin: 0; overflow: hidden;
    font-feature-settings: "ss01";
  }

  .tsm-tabs { display: flex; gap: 10px; margin-bottom: 16px; max-width: 480px; }
  .tsm-tab-btn {
    flex: 1; padding: 8px 16px; border-radius: 999px;
    border: 2px solid #e6e6e6; background: #fff;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    color: #3c3c3b; font-family: 'Open Sans', Arial, sans-serif;
    font-feature-settings: "ss01";
  }
  .tsm-tab-btn.active-settle   { background: #ff9000; border-color: #ff9000; color: #3c3c3b; }
  .tsm-tab-btn.active-paradigm { background: #009bbb; border-color: #009bbb; color: #fff; }

  .tsm-panel { display: none; flex-direction: column; gap: 20px; max-width: 560px; }
  .tsm-panel.active { display: flex; }

  .tsm-group { display: flex; flex-direction: column; gap: 8px; }
  .tsm-group-lbl {
    font-size: 18px; font-weight: 700; color: #3c3c3b;
    
    font-family: 'Open Sans', Arial, sans-serif;
  }
  .tsm-rings-row { display: flex; flex-wrap: wrap; gap: 20px; }

  .tsm-ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tsm-ring-lbl  { font-size: 15px; font-weight: 700; color: #3c3c3b; font-family: 'Open Sans', Arial, sans-serif; }
  .tsm-ring-sub  { font-size: 13px; color: #888; font-family: 'Open Sans', Arial, sans-serif; }

  .tsm-ring-box { position: relative; width: 100px; height: 100px; }
  .tsm-ring-box svg { transform: rotate(-90deg); display: block; }

  .tsm-ring-txt {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 800; line-height: 1;
    font-family: 'Open Sans', Arial, sans-serif;
    font-feature-settings: "ss01";
  }
  .tsm-ring-txt small { font-size: 0.8rem; font-weight: 700; }

  .tsm-arc {
    fill: none; stroke-linecap: round;
    stroke-dasharray: 263.9; stroke-dashoffset: 263.9;
    transition: stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1);
  }

  .tsm-divider { border: none; border-top: 1px solid #e6e6e6; margin: 0; }

  @media (max-width: 400px) {
    .tsm-rings-row { gap: 14px; }
    .tsm-ring-box { width: 90px; height: 90px; }
    .tsm-ring-txt { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="tsm-tabs">
  <button id="btn-settle"   class="tsm-tab-btn active-settle"   onclick="showTab('settle')">Settle</button>
  <button id="btn-paradigm" class="tsm-tab-btn"                 onclick="showTab('paradigm')">Paradigm</button>
</div>

<!-- SETTLE: General needs only -->
<div id="panel-settle" class="tsm-panel active">
  <div class="tsm-group">
    <div class="tsm-group-lbl">General needs</div>
    <div class="tsm-rings-row">
      <div class="tsm-ring-wrap">
        <div class="tsm-ring-lbl">Trust</div>
        <div class="tsm-ring-box">
          <svg width="100" height="100" viewBox="0 0 100 100">
            <circle fill="none" stroke="#e6e6e6" stroke-width="10" cx="50" cy="50" r="42"/>
            <circle id="arc-s-gn-t" class="tsm-arc" stroke="#ff9000" stroke-width="10" cx="50" cy="50" r="42"/>
          </svg>
          <div class="tsm-ring-txt" style="color:#ff9000"><span id="num-s-gn-t">0</span><small>%</small></div>
        </div>
        <div class="tsm-ring-sub">Jun-Dec 2025</div>
      </div>
      <div class="tsm-ring-wrap">
        <div class="tsm-ring-lbl">Ease</div>
        <div class="tsm-ring-box">
          <svg width="100" height="100" viewBox="0 0 100 100">
            <circle fill="none" stroke="#e6e6e6" stroke-width="10" cx="50" cy="50" r="42"/>
            <circle id="arc-s-gn-e" class="tsm-arc" stroke="#3c3c3b" stroke-width="10" cx="50" cy="50" r="42"/>
          </svg>
          <div class="tsm-ring-txt" style="color:#3c3c3b"><span id="num-s-gn-e">0</span><small>%</small></div>
        </div>
        <div class="tsm-ring-sub">Jun-Dec 2025</div>
      </div>
    </div>
  </div>
</div>

<!-- PARADIGM: General needs + Shared owners -->
<div id="panel-paradigm" class="tsm-panel">
  <div class="tsm-group">
    <div class="tsm-group-lbl">General needs</div>
    <div class="tsm-rings-row">
      <div class="tsm-ring-wrap">
        <div class="tsm-ring-lbl">Trust</div>
        <div class="tsm-ring-box">
          <svg width="100" height="100" viewBox="0 0 100 100">
            <circle fill="none" stroke="#e6e6e6" stroke-width="10" cx="50" cy="50" r="42"/>
            <circle id="arc-p-gn-t" class="tsm-arc" stroke="#009bbb" stroke-width="10" cx="50" cy="50" r="42"/>
          </svg>
          <div class="tsm-ring-txt" style="color:#009bbb"><span id="num-p-gn-t">0</span><small>%</small></div>
        </div>
        <div class="tsm-ring-sub">Jun-Dec 2025</div>
      </div>
      <div class="tsm-ring-wrap">
        <div class="tsm-ring-lbl">Ease</div>
        <div class="tsm-ring-box">
          <svg width="100" height="100" viewBox="0 0 100 100">
            <circle fill="none" stroke="#e6e6e6" stroke-width="10" cx="50" cy="50" r="42"/>
            <circle id="arc-p-gn-e" class="tsm-arc" stroke="#824bb0" stroke-width="10" cx="50" cy="50" r="42"/>
          </svg>
          <div class="tsm-ring-txt" style="color:#824bb0"><span id="num-p-gn-e">0</span><small>%</small></div>
        </div>
        <div class="tsm-ring-sub">Jun-Dec 2025</div>
      </div>
    </div>
  </div>

  <hr class="tsm-divider">

  <div class="tsm-group">
    <div class="tsm-group-lbl">Shared owners</div>
    <div class="tsm-rings-row">
      <div class="tsm-ring-wrap">
        <div class="tsm-ring-lbl">Trust</div>
        <div class="tsm-ring-box">
          <svg width="100" height="100" viewBox="0 0 100 100">
            <circle fill="none" stroke="#e6e6e6" stroke-width="10" cx="50" cy="50" r="42"/>
            <circle id="arc-p-so-t" class="tsm-arc" stroke="#009bbb" stroke-width="10" cx="50" cy="50" r="42"/>
          </svg>
          <div class="tsm-ring-txt" style="color:#009bbb"><span id="num-p-so-t">0</span><small>%</small></div>
        </div>
        <div class="tsm-ring-sub">Jun-Dec 2025</div>
      </div>
      <div class="tsm-ring-wrap">
        <div class="tsm-ring-lbl">Ease</div>
        <div class="tsm-ring-box">
          <svg width="100" height="100" viewBox="0 0 100 100">
            <circle fill="none" stroke="#e6e6e6" stroke-width="10" cx="50" cy="50" r="42"/>
            <circle id="arc-p-so-e" class="tsm-arc" stroke="#824bb0" stroke-width="10" cx="50" cy="50" r="42"/>
          </svg>
          <div class="tsm-ring-txt" style="color:#824bb0"><span id="num-p-so-e">0</span><small>%</small></div>
        </div>
        <div class="tsm-ring-sub">Jun-Dec 2025</div>
      </div>
    </div>
  </div>
</div>

<script>
  // *** UPDATE SCORES HERE ***
  var scores = {
    settle: {
      gn: { trust: 72, ease: 68 }   // General needs only
    },
    paradigm: {
      gn: { trust: 78, ease: 74 },  // General needs
      so: { trust: 70, ease: 66 }   // Shared owners
    }
  };

  var C = 263.9;
  var timers = [];

  function offset(pct) { return C - (pct / 100 * C); }

  function animateArc(id, pct) {
    var el = document.getElementById(id);
    if (!el) return;
    el.style.strokeDashoffset = C;
    el.getBoundingClientRect();
    el.style.strokeDashoffset = offset(pct);
  }

  function animateNum(id, pct) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = 0;
    var n = 0;
    var t = setInterval(function() {
      n++;
      el.textContent = n;
      if (n >= pct) clearInterval(t);
    }, 1400 / pct);
    timers.push(t);
  }

  function animateOrg(org) {
    var p = org === 'settle' ? 's' : 'p';
    var s = scores[org];
    animateArc('arc-' + p + '-gn-t', s.gn.trust);
    animateArc('arc-' + p + '-gn-e', s.gn.ease);
    animateNum('num-' + p + '-gn-t', s.gn.trust);
    animateNum('num-' + p + '-gn-e', s.gn.ease);
    if (s.so) {
      animateArc('arc-' + p + '-so-t', s.so.trust);
      animateArc('arc-' + p + '-so-e', s.so.ease);
      animateNum('num-' + p + '-so-t', s.so.trust);
      animateNum('num-' + p + '-so-e', s.so.ease);
    }
  }

  function showTab(org) {
    timers.forEach(clearInterval);
    timers = [];

    document.getElementById('btn-settle').className   = 'tsm-tab-btn' + (org === 'settle'   ? ' active-settle'   : '');
    document.getElementById('btn-paradigm').className = 'tsm-tab-btn' + (org === 'paradigm' ? ' active-paradigm' : '');

    document.getElementById('panel-settle').classList.toggle('active',   org === 'settle');
    document.getElementById('panel-paradigm').classList.toggle('active', org === 'paradigm');

    setTimeout(function() { animateOrg(org); }, 50);
  }

  window.onload = function() {
    setTimeout(function() { animateOrg('settle'); }, 400);
  };
</script>
</body>
</html>
